{% extends 'base.html' %}

{% block title %}Add Appointment - DrSeva.com{% endblock %}
{% block page_title %}Add New Appointment{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Patient <span class="text-danger">*</span></label>
                <select name="patient" class="form-control" required>
                    <option value="">Select Patient</option>
                    {% for patient in form.patient.field.queryset %}
                    <option value="{{ patient.id }}">{{ patient.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Doctor <span class="text-danger">*</span></label>
                <select name="doctor" class="form-control" required>
                    <option value="">Select Doctor</option>
                    {% for doctor in form.doctor.field.queryset %}
                    <option value="{{ doctor.id }}">Dr. {{ doctor.name }} - {{ doctor.specialty }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Date <span class="text-danger">*</span></label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Time <span class="text-danger">*</span></label>
                <input type="time" name="time" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Appointment Type</label>
                <select name="appointment_type" class="form-control">
                    <option value="Consultation">Consultation</option>
                    <option value="Follow-up">Follow-up</option>
                    <option value="Checkup">Checkup</option>
                    <option value="Emergency">Emergency</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Service Charge (৳) <span class="text-danger">*</span></label>
                <input type="number" name="service_charge" class="form-control" placeholder="Service Charge" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Assign to Employee</label>
                <select name="managed_by" class="form-control">
                    <option value="">-- Not Assigned --</option>
                    {% for employee in form.managed_by.field.queryset %}
                    <option value="{{ employee.id }}">{{ employee.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Additional Notes"></textarea>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_distributed" id="isDistributed">
                    <label class="form-check-label" for="isDistributed">Mark as Distributed</label>
                </div>
            </div>
        </div>
        
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Save Appointment
            </button>
            <a href="{% url 'appointments_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
