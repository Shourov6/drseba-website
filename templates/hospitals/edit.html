{% extends 'base.html' %}

{% block title %}Edit Hospital - DrSeva.com{% endblock %}
{% block page_title %}Edit Hospital{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Hospital ID</label>
                <input type="text" class="form-control" value="{{ hospital.hospital_id }}" disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Hospital Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ hospital.name }}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Location/Address <span class="text-danger">*</span></label>
                <textarea name="location" class="form-control" rows="3" required>{{ hospital.location }}</textarea>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Contact Number <span class="text-danger">*</span></label>
                <input type="text" name="contact" class="form-control" value="{{ hospital.contact }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" value="{{ hospital.email }}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Total Beds</label>
                <input type="number" name="total_beds" class="form-control" value="{{ hospital.total_beds }}">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">ICU Beds</label>
                <input type="number" name="icu_beds" class="form-control" value="{{ hospital.icu_beds }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                    <option value="Active" {% if hospital.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if hospital.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
        </div>
        
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Update Hospital
            </button>
            <a href="{% url 'hospitals_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
