{% extends 'base.html' %}

{% block title %}Add Hospital - DrSeva.com{% endblock %}
{% block page_title %}Add New Hospital{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Hospital Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" placeholder="Hospital Name" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Contact Number <span class="text-danger">*</span></label>
                <input type="text" name="contact" class="form-control" placeholder="Contact Number" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Location/Address <span class="text-danger">*</span></label>
                <textarea name="location" class="form-control" rows="3" placeholder="Hospital Location/Address" required></textarea>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Total Beds</label>
                <input type="number" name="total_beds" class="form-control" placeholder="Total Beds" value="0">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">ICU Beds</label>
                <input type="number" name="icu_beds" class="form-control" placeholder="ICU Beds" value="0">
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
        
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Save Hospital
            </button>
            <a href="{% url 'hospitals_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
