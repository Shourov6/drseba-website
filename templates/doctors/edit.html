{% extends 'base.html' %}

{% block title %}Edit Doctor - DrSeva.com{% endblock %}
{% block page_title %}Edit Doctor{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Doctor ID</label>
                <input type="text" class="form-control" value="{{ doctor.doctor_id }}" disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Profile Photo</label>
                <input type="file" name="profile_photo" class="form-control" accept="image/*">
                {% if doctor.profile_photo %}
                <small class="text-muted">Current: {{ doctor.profile_photo.name }}</small>
                {% endif %}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ doctor.name }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Age <span class="text-danger">*</span></label>
                <input type="number" name="age" class="form-control" value="{{ doctor.age }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Gender <span class="text-danger">*</span></label>
                <select name="gender" class="form-control" required>
                    <option value="Male" {% if doctor.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if doctor.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if doctor.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone <span class="text-danger">*</span></label>
                <input type="text" name="phone" class="form-control" value="{{ doctor.phone }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" value="{{ doctor.email }}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Qualification <span class="text-danger">*</span></label>
                <input type="text" name="qualification" class="form-control" value="{{ doctor.qualification }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Specialty <span class="text-danger">*</span></label>
                <input type="text" name="specialty" class="form-control" value="{{ doctor.specialty }}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Experience (Years) <span class="text-danger">*</span></label>
                <input type="number" name="experience" class="form-control" value="{{ doctor.experience }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">License Number <span class="text-danger">*</span></label>
                <input type="text" name="medical_license_number" class="form-control" value="{{ doctor.medical_license_number }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Commission %</label>
                <input type="number" name="commission_percentage" class="form-control" step="0.01" value="{{ doctor.commission_percentage }}">
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">About Doctor</label>
                <textarea name="about" class="form-control" rows="3">{{ doctor.about }}</textarea>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Consultation Language</label>
                <select name="consultation_language" class="form-control">
                    <option value="Bangla" {% if doctor.consultation_language == 'Bangla' %}selected{% endif %}>Bangla</option>
                    <option value="English" {% if doctor.consultation_language == 'English' %}selected{% endif %}>English</option>
                    <option value="Both" {% if doctor.consultation_language == 'Both' %}selected{% endif %}>Both</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Max Patients Per Day</label>
                <input type="number" name="max_patients_per_day" class="form-control" value="{{ doctor.max_patients_per_day }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                    <option value="Active" {% if doctor.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if doctor.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="online_appointment" id="onlineAppointment" {% if doctor.online_appointment %}checked{% endif %}>
                    <label class="form-check-label" for="onlineAppointment">Online Appointment</label>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="emergency_available" id="emergencyAvailable" {% if doctor.emergency_available %}checked{% endif %}>
                    <label class="form-check-label" for="emergencyAvailable">Emergency Available</label>
                </div>
            </div>
        </div>
        
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Update Doctor
            </button>
            <a href="{% url 'doctors_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
